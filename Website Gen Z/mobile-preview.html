<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;background:#1a1a22;}
  .stage{display:flex;justify-content:center;padding:18px 0 28px;}
  .phone{width:417px;height:876px;background:#0a0a0a;border-radius:58px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,0.6),inset 0 0 0 2px #2a2a30;position:relative;}
  .screen{width:393px;height:852px;border-radius:46px;overflow:hidden;background:#080808;position:relative;}
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:124px;height:34px;background:#000;border-radius:20px;z-index:20;}
  iframe{width:393px;height:852px;border:0;display:block;margin-top:50px;}
</style></head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <iframe id="pf" src="early-access.html" title="Nigh Early Access — iPhone 15"></iframe>
      </div>
    </div>
  </div>
</body></html>
