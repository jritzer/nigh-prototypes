<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nigh Host — Broadcast vs Drop Day (Calendar options)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#EEF0F4;color:#111827;min-height:100vh;padding:20px 12px}
.top{max-width:980px;margin:0 auto 16px;text-align:center}
.top h1{font-size:20px;font-weight:800}
.top p{font-size:13px;color:#6B7280;margin-top:4px}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.opt{border:1px solid #D1D5DB;background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#374151}
.opt.on{background:#0E4EF5;border-color:#0E4EF5;color:#fff}
.wrap{display:flex;gap:22px;justify-content:center;align-items:flex-start;flex-wrap:wrap;max-width:980px;margin:0 auto}
.phone{position:relative;width:390px;max-width:100%;height:800px;background:#fff;border-radius:38px;overflow:hidden;box-shadow:0 20px 50px rgba(17,24,39,0.18);border:1px solid #E5E7EB;display:flex;flex-direction:column}
.notes{width:340px;max-width:100%;background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:18px}
.notes h2{font-size:16px;font-weight:800;margin-bottom:6px}
.notes .sub{font-size:13px;color:#374151;line-height:1.5;margin-bottom:12px}
.notes h3{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6B7280;margin:12px 0 6px}
.notes li{font-size:13px;color:#374151;line-height:1.5;margin:0 0 5px 16px}
.scroll{flex:1;overflow-y:auto}
.scroll::-webkit-scrollbar{width:0}
.acct{background:#F3F4F6;padding:14px 16px 12px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:8px}
.cal{background:#fff;padding:10px 0 8px;border-bottom:1px solid #E5E7EB}
.calhdr{display:flex;justify-content:space-between;align-items:center;padding:0 14px;margin-bottom:8px}
.calhdr button{background:none;border:none;font-size:18px;color:#374151;cursor:pointer;padding:2px 6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);padding:0 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;cursor:pointer;border:none;background:none;font-family:inherit}
.day .wd{font-size:10px;color:#9CA3AF;font-weight:500}
.day .dn{font-size:16px;font-weight:500;color:#374151}
.day.sel{background:#0E4EF5}
.day.sel .wd{color:rgba(255,255,255,.75)}
.day.sel .dn{color:#fff;font-weight:700}
.day.today .dn{color:#0E4EF5;font-weight:700}
.day.today.sel .dn{color:#fff}
.sec{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6B7280;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;margin-bottom:10px;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;white-space:nowrap}
.legend{display:flex;gap:14px;justify-content:center;font-size:10px;color:#6B7280;padding:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.muted{color:#6B7280}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E5E7EB;border-radius:12px;margin-bottom:8px;background:#fff}
.empty{text-align:center;color:#9CA3AF;font-size:13px;padding:24px 0}
.nav{height:60px;border-top:1px solid #E5E7EB;display:flex;align-items:center;justify-content:space-around;color:#9CA3AF;flex-shrink:0;font-size:11px}
</style></head>
<body>
<div class="top">
  <h1>Broadcast days vs. drop day — Nigh Host calendar options</h1>
  <p>Standalone mockup · not part of the current prototypes. Today is Sat Nov 7, 8:00 AM. Tap days, change weeks, switch options and sample data. Options E–G add Coming Soon, multiple hype videos, 3+ drops a day and a Nigh preview.</p>
  <div class="opts" id="opts"></div>
</div>
<div class="wrap"><div class="phone" id="phone"></div><div class="notes" id="notes"></div></div>
<script>
// ── Sample data (Centro Boulder) ──
function D(d,h,m){return new Date(2026,10,d,h||0,m||0);}
var NOW=D(7,8,0);
var DROPS=[
 {id:1,title:'Friday Night Jazz & Tapas',bS:D(4,9),bE:D(6,18,45),dS:D(6,19),dE:D(6,22),timing:'Arrival window',status:'Ended',res:28,cap:30,price:'$25'},
 {id:2,title:'Sunset Trivia Night',bS:D(5,10),bE:D(9,17),dS:D(9,18),dE:D(9,21),timing:'Start time',status:'Live',res:14,cap:40,price:'Free'},
 {id:3,title:'Rooftop Social',bS:D(3,12),bE:D(8,18),dS:D(8,19),dE:D(8,23),timing:'Start time',status:'Live',soldOut:true,res:60,cap:60,price:'$15'},
 {id:4,title:'Saturday Morning Flow',bS:D(7,6),bE:D(7,8,45),dS:D(7,9),dE:D(7,10),timing:'Start time',status:'Live',res:9,cap:20,price:'Free'},
 {id:5,title:'Chef’s Table: Seven-Course Tasting Dinner with Wine Pairings from Our Sommelier',venue:'Frasca Food & Wine Private Dining Room at the Back of the Restaurant, 1738 Pearl Street Suite 100, Boulder, CO 80302',bS:D(6,9),bE:D(10,17),dS:D(10,19),dE:D(10,22),timing:'Start time',status:'Paused',res:6,cap:12,price:'$85'},
 {id:6,title:'Holiday Market Pop-Up',bS:D(8,9),bE:D(13,20),dS:D(14,10),dE:D(15,16),timing:'Arrival window · 2 days',status:'Scheduled',res:0,cap:200,price:'Free'}
];
var COL={Live:'#22C55E',SoldOut:'#15803D',Scheduled:'#EA580C',Paused:'#0E4EF5',Ended:'#6B7280',Pending:'#EAB308'};
var LBL={Live:'Broadcast Live',Paused:'Broadcast Paused',Scheduled:'Scheduled',Ended:'Broadcast Ended',Pending:'Broadcast Pending'};
var DROPC='#1B2A4A';
var S={opt:'A',day:D(7),weekStart:D(4)};
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// ── helpers ──
function d0(x){return new Date(x.getFullYear(),x.getMonth(),x.getDate());}
function same(a,b){return d0(a).getTime()===d0(b).getTime();}
function addD(x,n){var y=new Date(x);y.setDate(y.getDate()+n);return y;}
function overlaps(day,s,e){var a=d0(day),b=addD(a,1);return s<b&&e>=a;}
function isB(d,day){return overlaps(day,d.bS,d.bE);}
function isDrop(d,day){return overlaps(day,d.dS,d.dE);}
function t(x){var h=x.getHours(),m=x.getMinutes();var ap=h>=12?'PM':'AM';h=h%12||12;return h+(m?':'+String(m).padStart(2,'0'):'')+' '+ap;}
function dshort(x){return WD[x.getDay()]+' '+MO[x.getMonth()]+' '+x.getDate();}
function md(x){return MO[x.getMonth()]+' '+x.getDate();}
function bStateNow(d){if(NOW<d.bS)return 'Scheduled';if(NOW>d.bE)return 'Ended';return d.status==='Paused'?'Paused':'Live';}
function bcol(d){var s=bStateNow(d);return COL[s];}
function statusPill(d){var s=bStateNow(d);var c=COL[s];var h='<span class="pill" style="background:'+c+'1F;color:'+(s==='Scheduled'?'#C2410C':c)+'"><span style="width:6px;height:6px;border-radius:50%;background:'+c+'"></span>'+LBL[s]+'</span>';if(d.soldOut&&s==='Live')h+=' <span class="pill" style="background:#15803D;color:#fff">Sold Out</span>';return h;}
function countdown(d){var n=Math.round((d0(d.dS)-d0(NOW))/864e5);if(NOW>d.dE)return {t:'Drop ended',c:'#6B7280'};if(NOW>=d.dS)return {t:'Happening now',c:'#16A34A'};if(n===0)return {t:'Drop today · '+t(d.dS),c:'#0E4EF5'};if(n===1)return {t:'Drop tomorrow · '+t(d.dS),c:'#0E4EF5'};return {t:'Drop in '+n+' days · '+WD[d.dS.getDay()]+' '+t(d.dS),c:'#374151'};}
function dropWhen(d){return same(d.dS,d.dE)?dshort(d.dS)+' · '+t(d.dS)+(d.timing.indexOf('Arrival')===0?'–'+t(d.dE):''):md(d.dS)+'–'+md(d.dE)+' · '+t(d.dS)+'–'+t(d.dE)+' daily';}
function bWhen(d){return md(d.bS)+' '+t(d.bS)+' → '+md(d.bE)+' '+t(d.bE);}
var IC={
 bcast:function(c,s){s=s||13;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="9" r="1.6" fill="'+c+'" stroke="none"/><path d="M9.8 6.8a3.2 3.2 0 000 4.4M14.2 6.8a3.2 3.2 0 010 4.4M7.5 4.8a6 6 0 000 8.4M16.5 4.8a6 6 0 010 8.4M12 11v7"/></svg>';},
 ticket:function(c,s){s=s||13;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8a2 2 0 002-2h14a2 2 0 002 2v2a2 2 0 000 4v2a2 2 0 00-2 2H5a2 2 0 00-2-2v-2a2 2 0 000-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>';},
 clock:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
function weekDays(){var a=[];for(var i=0;i<7;i++)a.push(addD(S.weekStart,i));return a;}
function hdrBlock(){
 return '<div class="acct"><div style="width:32px;height:32px;border-radius:8px;background:#E5E7EB;display:flex;align-items:center;justify-content:center;font-weight:800;color:#374151">C</div><div style="font-size:14px;font-weight:700">Centro Boulder</div></div>';
}
function calHdr(){var ws=weekDays();return '<div class="calhdr"><button onclick="shiftWeek(-7)">‹</button><span style="font-size:14px;font-weight:700">'+MO[ws[3].getMonth()]+' '+ws[3].getFullYear()+'</span><button onclick="shiftWeek(7)">›</button></div>';}
function dayBtn(day,below){var cls='day'+(same(day,S.day)?' sel':'')+(same(day,NOW)?' today':'');return '<button class="'+cls+'" onclick="pick('+day.getDate()+')"><span class="wd">'+WD[day.getDay()]+'</span><span class="dn">'+day.getDate()+'</span>'+(below||'')+'</button>';}
function shiftWeek(n){S.weekStart=addD(S.weekStart,n);S.day=addD(S.day,n);render();}
function pick(n){var w=weekDays();for(var i=0;i<7;i++)if(w[i].getDate()===n)S.day=w[i];render();}
function navBar(){return '<div class="nav"><span>Home</span><span>Create</span><span style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6226E9,#0E4EF5)"></span><span>Inbox</span><span>Menu</span></div>';}
function heroCard(d,day){
 var cd=countdown(d);var s=bStateNow(d);
 var bLine=NOW<d.bS?'Broadcast starts '+md(d.bS)+' '+t(d.bS):NOW>d.bE?'Broadcast ended '+md(d.bE)+' '+t(d.bE):'Broadcast '+(s==='Paused'?'paused':'live')+' until '+(same(d.bE,NOW)?t(d.bE):md(d.bE)+' '+t(d.bE));
 return '<div class="card" style="border:2px solid '+DROPC+'"><div style="height:90px;background:linear-gradient(135deg,#1B2A4A,#0E4EF5);position:relative"><div style="position:absolute;top:10px;left:12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.95);border-radius:10px;padding:3px 9px;font-size:11px;font-weight:800;color:'+DROPC+'">'+IC.ticket(DROPC,12)+' DROP DAY</div></div>'
  +'<div style="padding:10px 14px"><div style="font-size:16px;font-weight:700;margin-bottom:4px">'+d.title+'</div>'
  +'<div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#111827;margin-bottom:6px">'+IC.clock+' '+dropWhen(d)+'</div>'
  +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">'+statusPill(d)+'</div>'
  +'<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#6B7280">'+IC.bcast('#6B7280',12)+' '+bLine+'</div>'
  +'<div style="font-size:12px;color:#6B7280;margin-top:4px">'+d.res+'/'+d.cap+' reserved · '+d.price+'</div></div></div>';
}
// ══ OPTION A — broadcast bars + drop-day markers, split day view ══
function optA(){
 var ws=weekDays();
 var vis=DROPS.filter(function(d){return ws.some(function(w){return isB(d,w)||isDrop(d,w);});});
 var rows=vis.map(function(d){
  var bc=bcol(d);var past=NOW>d.bE;var h='';
  var bs=-1,be=-1,dc=[];ws.forEach(function(w,i){if(isB(d,w)){if(bs<0)bs=i;be=i;}if(isDrop(d,w))dc.push(i);});
  if(bs>=0){var L=bs+(dc.indexOf(bs)>-1&&bs===be?0.2:0.15),R=be+(dc.indexOf(be)>-1?0.5:(be===6&&d.bE>addD(ws[6],1)?1:0.85));
   h+='<div style="position:absolute;top:6px;height:5px;border-radius:3px;left:'+(L/7*100)+'%;width:'+((R-L)/7*100)+'%;background:'+(past?'#D1D5DB':bc)+'"></div>';}
  dc.forEach(function(i){var c=NOW>d.dE?'#9CA3AF':DROPC;h+='<div style="position:absolute;top:0;left:calc('+((i+0.5)/7*100)+'% - 8px);width:16px;height:16px;border-radius:50%;background:'+c+';border:2px solid #fff;box-shadow:0 0 0 1px '+c+';display:flex;align-items:center;justify-content:center">'+IC.ticket('#fff',8)+'</div>';});
  return '<div style="position:relative;height:17px;margin:3px 6px 0">'+h+'</div>';
 }).join('');
 var happening=DROPS.filter(function(d){return isDrop(d,S.day);});
 var bcasting=DROPS.filter(function(d){return isB(d,S.day)&&!isDrop(d,S.day);});
 var body='<div class="sec">'+IC.ticket('#6B7280',13)+' Happening '+(same(S.day,NOW)?'today':dshort(S.day))+'</div>'+(happening.length?happening.map(function(d){return heroCard(d,S.day);}).join(''):'<div class="empty">No drops happening this day.</div>')
  +'<div class="sec">'+IC.bcast('#6B7280',13)+' Broadcasting '+(same(S.day,NOW)?'today':'this day')+' · happens later</div>'
  +(bcasting.length?bcasting.map(function(d){var cd=countdown(d);return '<div class="row"><div style="width:4px;align-self:stretch;border-radius:2px;background:'+bcol(d)+'"></div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700">'+d.title+'</div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0">'+statusPill(d)+'</div><div style="font-size:12px;color:'+cd.c+';font-weight:600">'+IC.ticket(cd.c,11)+' '+cd.t+'</div></div></div>';}).join(''):'<div class="empty">Nothing broadcasting for a later date.</div>');
 return hdrBlock()+'<div class="cal">'+calHdr()+'<div class="week">'+ws.map(function(w){return dayBtn(w);}).join('')+'</div>'+rows
  +'<div class="legend"><span><span style="width:18px;height:5px;border-radius:3px;background:#22C55E"></span>Broadcasting</span><span><span style="width:12px;height:12px;border-radius:50%;background:'+DROPC+'"></span>Drop day</span><span><span style="width:18px;height:5px;border-radius:3px;background:#D1D5DB"></span>Broadcast ended</span></div></div>'
  +'<div class="scroll" style="padding:0 16px 16px">'+body+'</div>'+navBar();
}
// ══ OPTION B — two marker types + timeline on every card ══
function timeline(d){
 var start=new Date(Math.min(d.bS,NOW)),end=new Date(Math.max(d.dE,NOW));var span=end-start;var pct=function(x){return Math.max(0,Math.min(100,(x-start)/span*100));};
 var bl=pct(d.bS),bw=pct(d.bE)-bl,dl=pct(d.dS),dw=Math.max(6,pct(d.dE)-dl),nl=pct(NOW);if(dl+dw>100)dl=100-dw;
 return '<div style="position:relative;height:26px;margin:10px 2px 4px">'
  +'<div style="position:absolute;top:11px;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#E5E7EB 0 4px,transparent 4px 8px)"></div>'
  +'<div style="position:absolute;top:10px;left:'+bl+'%;width:'+bw+'%;height:5px;border-radius:3px;background:'+(NOW>d.bE?'#D1D5DB':bcol(d))+'"></div>'
  +'<div style="position:absolute;top:5px;left:'+dl+'%;width:'+dw+'%;height:15px;border-radius:5px;background:'+DROPC+';display:flex;align-items:center;justify-content:center">'+IC.ticket('#fff',9)+'</div>'
  +'<div style="position:absolute;top:0;left:'+nl+'%;width:2px;height:26px;background:#EF4444;border-radius:1px"></div><div style="position:absolute;top:-14px;left:calc('+nl+'% - 12px);font-size:9px;font-weight:800;color:#EF4444">NOW</div>'
  +'</div><div style="display:flex;justify-content:space-between;font-size:10px;color:#6B7280"><span>'+IC.bcast('#6B7280',10)+' '+md(d.bS)+' → '+md(d.bE)+'</span><span style="color:'+DROPC+';font-weight:700">'+IC.ticket(DROPC,10)+' '+md(d.dS)+(same(d.dS,d.dE)?'':'–'+md(d.dE))+'</span></div>';
}
function optB(){
 var ws=weekDays();
 var mk=function(w){var drop=DROPS.some(function(d){return isDrop(d,w);});var b=DROPS.filter(function(d){return isB(d,w)&&!isDrop(d,w)&&NOW<=d.bE;});var sel=same(w,S.day);
  return '<span style="display:flex;gap:3px;height:9px;align-items:center">'+(b.length?'<span style="width:8px;height:8px;border-radius:50%;border:2px solid '+(sel?'#fff':bcol(b[0]))+'"></span>':'')+(drop?'<span style="width:8px;height:8px;border-radius:2px;background:'+(sel?'#fff':DROPC)+';transform:rotate(45deg)"></span>':'')+'</span>';};
 var list=DROPS.filter(function(d){return isB(d,S.day)||isDrop(d,S.day);}).sort(function(a,b){return a.dS-b.dS;});
 var body=list.length?list.map(function(d){var cd=countdown(d);var dropToday=isDrop(d,S.day);
   return '<div class="card" style="padding:12px 14px;'+(dropToday?'border:2px solid '+DROPC:'')+'"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div style="font-size:15px;font-weight:700">'+d.title+'</div><span class="pill" style="background:'+(dropToday?DROPC:'#F3F4F6')+';color:'+(dropToday?'#fff':cd.c)+'">'+(dropToday?'Drop day':cd.t.split(' · ')[0])+'</span></div>'
    +'<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 4px">'+statusPill(d)+'</div>'
    +timeline(d)
    +'<div style="font-size:12px;color:'+cd.c+';font-weight:600;margin-top:8px">'+cd.t+'</div></div>';}).join(''):'<div class="empty">Nothing broadcasting or happening this day.</div>';
 return hdrBlock()+'<div class="cal">'+calHdr()+'<div class="week">'+ws.map(function(w){return dayBtn(w,mk(w));}).join('')+'</div>'
  +'<div class="legend"><span><span style="width:8px;height:8px;border-radius:50%;border:2px solid #22C55E"></span>Broadcasting</span><span><span style="width:8px;height:8px;border-radius:2px;background:'+DROPC+';transform:rotate(45deg)"></span>Drop day</span><span><span style="width:2px;height:10px;background:#EF4444"></span>Now</span></div></div>'
  +'<div class="scroll" style="padding:14px 16px">'+body+'</div>'+navBar();
}
// ══ OPTION C — week planner (one lane per drop) ══
function optC(){
 var ws=weekDays();var selI=ws.findIndex(function(w){return same(w,S.day);});
 var vis=DROPS.filter(function(d){return ws.some(function(w){return isB(d,w)||isDrop(d,w);});});
 var lanes=vis.map(function(d){
  var bs=-1,be=-1,dc=[];ws.forEach(function(w,i){if(isB(d,w)){if(bs<0)bs=i;be=i;}if(isDrop(d,w))dc.push(i);});
  var cells='';var past=NOW>d.bE;
  if(bs>=0){var L=bs+0.05,R=be+(dc.indexOf(be)>-1?0.3:(be===6&&d.bE>addD(ws[6],1)?1:0.95));cells+='<div style="position:absolute;top:7px;height:8px;border-radius:4px;left:'+(L/7*100)+'%;width:'+((R-L)/7*100)+'%;background:'+(past?'#E5E7EB':bcol(d))+';display:flex;align-items:center;padding-left:4px;overflow:hidden">'+(R-L>=1.6&&!past?'<span style="font-size:8px;font-weight:800;color:#fff;letter-spacing:.03em">BROADCAST</span>':'')+'</div>';}
  dc.forEach(function(i){cells+='<div style="position:absolute;top:0;left:calc('+(i/7*100)+'% + 2px);width:calc('+(100/7)+'% - 4px);height:22px;border-radius:6px;background:'+(NOW>d.dE?'#9CA3AF':DROPC)+';color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:2px">'+IC.ticket('#fff',9)+t(d.dS).replace(' ','')+'</div>';});
  return '<div onclick="S.focus='+d.id+';render()" style="padding:6px 0 8px;border-bottom:1px solid #F3F4F6;cursor:pointer"><div style="font-size:11px;font-weight:700;color:#111827;margin:0 10px 4px;display:flex;justify-content:space-between"><span>'+d.title+'</span>'+(d.soldOut?'<span style="color:#15803D">Sold Out</span>':'')+'</div><div style="position:relative;height:22px;margin:0 6px">'+cells+'</div></div>';
 }).join('');

 return '<div onclick="S.av=null;render()" style="position:absolute;inset:0;background:rgba(10,10,20,0.35);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px">'

// ══ OPTION K — up to 5 time slots per drop; spots + price per slot (no overall spots bar) ══
var SLOT_DEF={2:[[19,0,'$15',12,12],[19,30,'$15',12,12],[20,0,'$15',12,10],[20,30,'$12',12,6],[21,0,'$10',12,3]],
 14:[[19,0,'$15',12,12],[19,30,'$15',12,12],[20,0,'$15',12,10],[20,30,'$12',12,6],[21,0,'$10',12,3]],
 6:[[9,0,'$8',20,20],[10,0,'$8',20,14],[11,0,'$8',20,8],[12,0,'$6',20,4]],
 12:[[9,0,'$12',6,6],[9,30,'$12',5,3],[10,0,'$12',5,2]],
 3:[[18,0,'Free',20,9],[19,30,'Free',20,3]],15:[[18,0,'Free',20,9],[19,30,'Free',20,3]],
 4:[[19,0,'$85',6,4],[21,0,'$85',6,2]],16:[[19,0,'$85',6,4],[21,0,'$85',6,2]],
 13:[[11,0,'Free',10,10],[11,45,'Free',10,9],[12,30,'Free',10,8],[13,15,'Free',10,5],[14,0,'Free',10,2]]};
function kSlots(d){if(d._slots)return d._slots;var def=SLOT_DEF[d.id];var base=d0(d.dS);
 d._slots=def?def.map(function(x){return {t:new Date(base.getTime()+x[0]*36e5+x[1]*6e4),price:x[2],cap:x[3],res:x[4]};}):[{t:d.dS,price:d.price,cap:d.cap,res:d.res}];return d._slots;}
function kBody(d){
 var sl=kSlots(d);var tot=sl.reduce(function(a,x){return a+x.cap;},0),res=sl.reduce(function(a,x){return a+x.res;},0);
 var v=d.venue||'Centro Boulder, 950 Pearl St, Boulder, CO';var k=v.indexOf(',');var nm=k>0?v.slice(0,k):v,ad=k>0?v.slice(k+1).trim():'';
 var ciOf=function(x){return NOW>=x.t?Math.round(x.res*0.6):0;};var ciTot=sl.reduce(function(a,x){return a+ciOf(x);},0);
 var G='display:grid;grid-template-columns:60px 1fr 1fr 62px 40px;align-items:center;gap:4px';
 var head='<div style="'+G+';font-size:9px;font-weight:700;letter-spacing:.03em;color:#9CA3AF;text-transform:uppercase;padding:6px 0 4px;border-bottom:1px solid #E5E7EB"><span>Time</span><span style="text-align:center">Reserved</span><span style="text-align:center">Checked In</span><span style="text-align:right">Spots</span><span style="text-align:right">Price</span></div>';
 var rows=sl.map(function(x,i){var full=x.res>=x.cap;var past=NOW>new Date(x.t.getTime()+30*6e4)&&NOW>d.dS;
  return '<div style="'+G+';font-size:12px;padding:5px 0;border-bottom:1px solid #F3F4F6;'+(past?'opacity:.6;':'')+'"><span style="font-weight:600;color:#111827;white-space:nowrap">'+tL(x.t)+'</span><span style="text-align:center;font-weight:700;color:#0284C7">'+x.res+'</span><span style="text-align:center;font-weight:700;color:#0D9488">'+ciOf(x)+'</span><span style="text-align:right;white-space:nowrap">'+(full?'<span style="font-size:9px;font-weight:800;color:#92400E;background:#FEF3C7;padding:1px 5px;border-radius:6px">FULL</span> ':'')+'<b style="color:#111827">'+x.cap+'</b></span><span style="text-align:right;color:#374151">'+x.price+'</span></div>';}).join('');
 var foot='<div style="'+G+';font-size:12px;padding:5px 0 2px"><span style="font-weight:700;color:#6B7280">Total</span><span style="text-align:center;font-weight:800;color:#0284C7">'+res+'</span><span style="text-align:center;font-weight:800;color:#0D9488">'+ciTot+'</span><span style="text-align:right;font-weight:800;color:#111827">'+tot+'</span><span></span></div>';
 return '<div style="padding:8px 14px 6px;height:282px;box-sizing:border-box;overflow:hidden"><div style="font-size:16px;font-weight:700;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+d.title+'</div>'
  +'<div style="display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:#374151;margin-top:2px">'+hic('clock',13)+' '+dayWord(d.dS)+' <span style="color:#9CA3AF;font-size:12px">· '+sl.length+' time slot'+(sl.length>1?'s':'')+'</span></div>'
  +'<div style="display:flex;gap:5px;margin:3px 0 4px;height:32px"><span style="color:#6B7280;margin-top:1px">'+hic('map',13)+'</span><div style="font-size:12px;color:#374151;min-width:0;flex:1"><div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+nm+'</div><div style="color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(ad||'&nbsp;')+'</div></div></div>'
  +head+rows+foot+'</div>';
}

NOTES.K={t:'K · Time slots (up to 5)',sub:'Same card as I, sized to fit on one phone screen. The drop has up to 5 time slots, each on one row: time, price, reserved, checked in and spots (FULL when sold out), with a total row. The overall spots bar is gone. Tap the media area to preview. “Drop starts in” counts down to the first slot.',pros:['Handles seatings, classes and staggered entry','Price can differ by slot (e.g. later slots cheaper)','Sold-out slots are obvious at a glance'],cons:['Card gets taller with 5 slots','Check-in total is for the whole drop, not per slot']};

// ── Overlay "poke" messages: ranked list, show top POKE_MAX. Add new ones to POKES; reorder to re-rank. Space is reserved for POKE_MAX so the card height never changes.
var POKE_MAX=3;
var POKES=[
 {key:'broadcast',label:'Broadcast countdown',fn:function(d){return iRemain(d);}},
 {key:'zone',label:'Nigh Zone',fn:function(d){return iZone(d,null);}},
 {key:'drop',label:'Drop countdown',fn:function(d){return iDropIn(d,null);}},
 {key:'spots',label:'Spots left (example)',fn:function(d){var l=d.cap-d.res;return (bStateNow(d)==='Live'&&l>0&&l<=Math.max(5,Math.round(d.cap*0.25)))?'Only <span style="color:#FBBF24;font-weight:700">'+l+' spots</span> left':'';}},
 {key:'views',label:'Viewing now (example)',fn:function(d){return bStateNow(d)==='Live'?'<span style="font-weight:700">'+(12+d.id*7%40)+'</span> people viewing now':'';}}
];
function pokeList(d){var out=[];for(var i=0;i<POKES.length&&out.length<POKE_MAX;i++){var t=POKES[i].fn(d);if(t)out.push(t);}return out;}
function pokesHTML(d,bgc){return pokeList(d).map(function(t){return '<span style="display:inline-block;max-width:255px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:600;color:#fff;background:'+bgc+';border-radius:6px;padding:4px 9px">'+t+'</span>';}).join('');}
function pokeMove(i,dir){var j=i+dir;if(j<0||j>=POKES.length)return;var t=POKES[i];POKES[i]=POKES[j];POKES[j]=t;render();}
function pokeSetMax(n){POKE_MAX=n;render();}
function pokePanel(){return '<h3>Overlay messages (ranked)</h3><div style="font-size:12px;color:#374151;margin-bottom:6px">Show top <select onchange="pokeSetMax(+this.value)" style="font:inherit;padding:2px 4px;border:1px solid #D1D5DB;border-radius:6px">'+[1,2,3,4].map(function(n){return '<option'+(n===POKE_MAX?' selected':'')+'>'+n+'</option>';}).join('')+'</select> · the card reserves space for this many so its height stays fixed.</div>'
 +POKES.map(function(p,i){return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 8px;border:1px solid #E5E7EB;border-radius:8px;margin-bottom:4px;background:'+(i<POKE_MAX?'#F0F5FF':'#fff')+'"><b style="width:16px;color:#6B7280">'+(i+1)+'</b><span style="flex:1">'+p.label+'</span><button onclick="pokeMove('+i+',-1)" style="border:none;background:none;cursor:pointer">▲</button><button onclick="pokeMove('+i+',1)" style="border:none;background:none;cursor:pointer">▼</button></div>';}).join('')
 +'<div style="font-size:11px;color:#6B7280;margin-top:4px">A message only shows when it applies (e.g. no Nigh Zone line after the broadcast ends), so the next-ranked one moves up.</div>';}

function timeRow(d){
 var arr=d.timing.indexOf('Arrival')===0;var multi=!same(d.dS,d.dE);
 var when=multi?(MO[d.dS.getMonth()]+' '+d.dS.getDate()+'–'+(d.dE.getMonth()===d.dS.getMonth()?'':MO[d.dE.getMonth()]+' ')+d.dE.getDate()+' · '+tL(d.dS)+' – '+tL(d.dE)):(dayWord(d.dS)+' '+tL(d.dS)+(arr?' – '+tL(d.dE):''));
 return '<div style="display:flex;align-items:center;gap:14px;height:20px;margin-bottom:2px;font-size:14px;font-weight:500;color:#374151"><span style="display:flex;align-items:center;gap:5px;min-width:0">'+hic('clock',13)+'<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+when+'</span></span><span style="flex-shrink:0">'+d.price+'</span></div>';

function optI(){
 if(S.hView==='schedule'&&S.opt!=='I')return optG();
 var ws=weekDays();var day=S.day;
 var happening=DROPS.filter(function(d){return isDrop(d,day);}).sort(function(a,b){return a.dS-b.dS;});
 var also=DROPS.filter(function(d){return isB(d,day)&&!isDrop(d,day);}).sort(function(a,b){return a.dS-b.dS;});
 var body=(happening.length?happening.map(function(d){return iCard(d,day);}).join(''):'<div style="text-align:center;padding:14px 0 4px"><div style="font-size:13px;font-weight:700;color:#374151">No drops '+(same(day,NOW)?'today':'on '+dshort(day))+'</div></div>')
  +also.map(function(d){return iCard(d,day);}).join('');
 return hdrBlock()+'<div class="cal">'+calHdr()+'<div class="week">'+ws.map(function(w){return dayBtn(w,dayBelowH(w));}).join('')+'</div></div>'
  +'<div class="scroll" style="padding:14px 16px;background:#F9FAFB">'+body+'</div>'+navBar()+pvOverlay()+zvOverlay()+avOverlay()+zoffOverlay();

NOTES.I={t:'I · Current drop card + video timeline',sub:'Starts from today’s Nigh Host drop card. The media area now shows the video that’s playing, with a timeline across the bottom: Coming Soon (striped) → Broadcast (green) → Nigh Zone (cyan) → Drop, with a red “now” line. Video thumbnails and the per-video schedule live in J. The top row reads “Broadcast Live” (or Paused / Coming Soon / Scheduled / Ended) with the audience icon at the right edge. Time remaining moved to the lower left, across from Share. The time row says Today, Tomorrow or the date. Broadcast-only drops use the same card under “Also broadcasting.”',pros:['Smallest change to the real app card','Timeline and videos live where the media already is','“Today / Tomorrow / Mon Nov 9” makes the drop day obvious in the card','Tap the play button or any thumbnail to preview what guests see'],cons:['Small thumbnails when a drop has many videos','Same-size cards for broadcast-only drops make the feed longer']};

NOTES.J={t:'J · Card with 4 videos across the timeline',sub:'Same card as I, but the media area shows the hype-video plan instead of one big video: the drop’s 4 hype videos in an even row, each with when it starts and ends playing (S: 11/7 6:00 PM · E: 11/7 8:00 PM), above the timeline (Coming Soon → Broadcast → Drop, red “now” line). The video playing now has a green outline. Videos are added and edited in Create / Edit, not here. Opening J switches to Future sample data. Tap any thumbnail to preview what guests see.',pros:['Whole hype sequence visible at once','Each video shows exactly when it starts and ends','Compact S / E times never wrap'],cons:['Loses the big “what’s playing” hero image','Thumbnails are small for judging the video itself (preview fixes that)']};
