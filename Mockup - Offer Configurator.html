<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nigh — Offer & Drop Configurator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F1F5F9;color:#111827}
.wrap{max-width:720px;margin:0 auto;padding:22px 18px 120px}
.top{margin-bottom:16px}
h1{font-size:21px;font-weight:800;margin-bottom:2px}
.sub{font-size:13px;color:#6B7280}

/* stepper */
.stepper{display:flex;gap:6px;margin:18px 0 20px}
.step{flex:1;cursor:pointer;text-align:left}
.step .bar{height:4px;border-radius:999px;background:#E2E8F0;margin-bottom:7px}
.step.done .bar,.step.cur .bar{background:#0E4EF5}
.step .lbl{font-size:11px;font-weight:600;color:#9CA3AF;display:flex;align-items:center;gap:5px}
.step.cur .lbl{color:#0E4EF5}
.step.done .lbl{color:#374151}
.step .num{width:16px;height:16px;border-radius:999px;background:#E2E8F0;color:#6B7280;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.step.cur .num{background:#0E4EF5;color:#fff}
.step.done .num{background:#DBEAFE;color:#0E4EF5}

.card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:16px 16px;margin-bottom:14px}
.card.pad{padding:18px}
h2{font-size:15px;font-weight:800;color:#111827;margin-bottom:3px}
.h2sub{font-size:12px;color:#6B7280;margin-bottom:14px}
.sec{font-size:10px;font-weight:700;color:#9CA3AF;letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid.one{grid-template-columns:1fr}
.f label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
.f select,.f input[type=number],.f input[type=text]{width:100%;padding:10px 11px;border:1px solid #E5E7EB;border-radius:10px;font-size:13px;background:#fff;color:#111827;outline:none}
.f select:focus,.f input:focus{border-color:#0E4EF5;box-shadow:0 0 0 3px rgba(14,78,245,.1)}

/* template chooser */
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #E5E7EB;border-radius:12px;background:#fff;cursor:pointer;text-align:left;transition:.12s}
.tpl:hover{border-color:#0E4EF5;background:#F8FAFF}
.tpl.on{border-color:#0E4EF5;background:#F8FAFF;box-shadow:0 0 0 3px rgba(14,78,245,.1)}
.tile{width:42px;height:42px;border-radius:11px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.tpl.on .tile{background:#DBEAFE}
.tpl .tt{font-size:13px;font-weight:700;color:#111827;line-height:1.2}
.tpl .td{font-size:11px;color:#9CA3AF;margin-top:2px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid #E5E7EB;background:#fff;color:#374151;cursor:pointer;user-select:none}
.chip.on{background:#0E4EF5;border-color:#0E4EF5;color:#fff}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#374151;cursor:pointer}
.tog input{width:16px;height:16px;accent-color:#0E4EF5}

/* offer */
.offer{border:1px solid #E5E7EB;border-radius:14px;padding:15px;margin-bottom:12px;background:#fff}
.offerhd{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.obadge{font-size:10px;font-weight:700;color:#0E4EF5;background:#EEF2FF;padding:3px 9px;border-radius:999px}
.onum{font-size:11px;font-weight:700;color:#9CA3AF}
.adv{margin-top:12px;border-top:1px solid #F1F5F9;padding-top:12px}
.advtog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#0E4EF5;cursor:pointer;user-select:none}
.advtog .car{transition:.12s;font-size:10px}
.advtog.open .car{transform:rotate(90deg)}

.btn{border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.btn-primary{background:#0E4EF5;color:#fff}
.btn-ghost{background:#fff;color:#374151;border:1px solid #E5E7EB}
.btn-add{width:100%;background:#F8FAFF;color:#0E4EF5;border:1px dashed #BFD3FF;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer}
.btn-x{background:none;border:none;color:#C4C9D4;font-size:17px;cursor:pointer;margin-left:auto;line-height:1}
.btn-x:hover{color:#EF4444}

/* review */
.rev{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
.rev dt{color:#6B7280;font-weight:600}
.rev dd{color:#111827;font-weight:600;text-align:right}
.ro{border:1px solid #E5E7EB;border-radius:12px;padding:13px;margin-bottom:10px;background:#fff}
.ro .roh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.rtag{font-size:12px;color:#374151;background:#F3F4F6;border-radius:7px;padding:3px 8px;font-weight:600;display:inline-block;margin:3px 4px 0 0}
details.json{margin-top:6px}
details.json summary{cursor:pointer;font-size:12.5px;font-weight:700;color:#6B7280;padding:6px 0}
pre{background:#0B1020;color:#C7D2FE;border-radius:12px;padding:14px;font-size:11px;line-height:1.5;overflow:auto;max-height:460px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin-top:8px}

/* footer */
.foot{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-top:1px solid #E5E7EB;padding:14px 18px}
.footin{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.footin .spacer{flex:1}
.ghosthint{font-size:11px;color:#9CA3AF}
@media(max-width:640px){.grid,.tpls{grid-template-columns:1fr}.step .lbl span.txt{display:none}}
</style></head>

function sel(val,opts,onchg){return `<select onchange="${onchg}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;}
function setDrop(k,v){CFG.drop[k]=v;render();}
function setOffer(i,k,v){CFG.offers[i][k]=v;render();}
function setBool(i,k,v){CFG.offers[i][k]=v;render();}
function toggleElig(i,e){const a=CFG.offers[i].eligibility;const x=a.indexOf(e);if(x<0)a.push(e);else a.splice(x,1);render();}
function changeArch(i,a){const keepName=CFG.offers[i].name;CFG.offers[i]=newOffer(a);CFG.offers[i].name=keepName;render();}
function addOffer(){CFG.offers.push(newOffer('Ticketed admission'));S.adv[CFG.offers.length-1]=true;render();}
function removeOffer(i){CFG.offers.splice(i,1);if(!CFG.offers.length)CFG.offers.push(newOffer('RSVP / reservation'));render();}
function toggleAdv(i){S.adv[i]=!S.adv[i];render();}
function addSection(i){CFG.offers[i].sections.push({name:'',price:'',seats:''});render();}
function removeSection(i,j){CFG.offers[i].sections.splice(j,1);render();}
function setSection(i,j,k,v){CFG.offers[i].sections[j][k]=v;render();}
const DROP_DEFAULTS={schedule:'One-off',timing:'Fixed start time',location:'Fixed venue',access:'Public',capacity:'Per offer',verification:'None',privacy:'Social — discoverable',spontaneity:'Same-day',exclusivity:'Medium',proximity:'Open — transact anywhere',viewRadius:''};
function loadTemplate(name){const t=TEMPLATES[name];if(!t)return;CFG={drop:Object.assign({},DROP_DEFAULTS,t.drop),offers:t.offers.map(x=>{if(typeof x==='string')return newOffer(x);const o=newOffer(x.a);Object.assign(o,x.set||{});return o;})};}
function buildOffers(list){return list.map(x=>{if(typeof x==='string')return newOffer(x);const o=newOffer(x.a);Object.assign(o,x.set||{});if(o.sections)o.sections=o.sections.map(s=>({...s}));return o;});}
function loadExample(name){const e=EXAMPLES[name];if(!e)return;CFG={drop:Object.assign({},DROP_DEFAULTS,e.drop),offers:buildOffers(e.offers)};}
function pickTemplate(name){S.template=name;if(name==='__blank__'){CFG={drop:Object.assign({},DROP_DEFAULTS),offers:[newOffer('Ticketed admission')]};}else if(EXAMPLES[name]){loadExample(name);}else{loadTemplate(name);}S.step=2;render();}
function goStep(n){if(n<1||n>4)return;S.step=n;render();}

/* ---------- STEP 1: business template ---------- */
function screenBusiness(){
  const cards=Object.keys(TEMPLATES).map(name=>{const[ic,desc]=TPL_META[name]||['🏪',''];
    return `<button class="tpl ${S.template===name?'on':''}" onclick="pickTemplate('${name}')">
      <div class="tile">${ic}</div><div><div class="tt">${name}</div><div class="td">${desc}</div></div></button>`;}).join('');
  const exCards=Object.keys(EXAMPLES).map(name=>{const e=EXAMPLES[name];
    return `<button class="tpl ${S.template===name?'on':''}" onclick="pickTemplate('${name.replace(/'/g,"\\'")}')">
      <div class="tile">${e.icon}</div><div><div class="tt">${name}</div><div class="td">${e.desc}</div></div></button>`;}).join('');
  return `<div class="card pad">
    <h2>What are you setting up?</h2>
    <div class="h2sub">Pick a business type to start from a sensible template — or start blank. You can change anything after.</div>
    <div class="tpls">${cards}</div>
    <button class="tpl ${S.template==='__blank__'?'on':''}" style="width:100%;margin-top:10px" onclick="pickTemplate('__blank__')">
      <div class="tile">＋</div><div><div class="tt">Start blank</div><div class="td">Build a drop from scratch</div></div></button>
  </div>
  <div class="card pad">
    <h2>Elevate IRL examples</h2>
    <div class="h2sub">Worked drops from the pitch deck — geofenced, sponsored, and time-sensitive. Load one to see every offer configured.</div>
    <div class="tpls">${exCards}</div>
  </div>`;
}

/* ---------- STEP 2: drop setup ---------- */
function dropField(k){const[,label,opts]=DROP_FIELDS.find(f=>f[0]===k);
  if(opts==='TEXT')return `<div class="f"><label>${label}</label><input type="text" value="${CFG.drop[k]||''}" placeholder="e.g. 10 mi — leave blank if none" onchange="setDrop('${k}',this.value)"></div>`;
  return `<div class="f"><label>${label}</label>${sel(CFG.drop[k],opts,`setDrop('${k}',this.value)`)}</div>`;}
function screenDrop(){
  const groups=DROP_GROUPS.map(([title,keys])=>`<div class="card">
    <div class="sec">${title}</div>
    <div class="grid">${keys.map(dropField).join('')}</div>
  </div>`).join('');
  return `<div class="card pad" style="margin-bottom:14px"><h2>Drop setup</h2><div class="h2sub" style="margin:0">The drop is the container. These settings apply to every offer inside it.</div></div>${groups}`;
}

  const pwyw = o.pricing==='Pay-what-you-want'?`<div class="f"><label>Minimum ($)</label><input type="number" value="${o.minAmount}" onchange="setOffer(${i},'minAmount',this.value)"></div><div class="f"><label>Suggested ($)</label><input type="number" value="${o.suggested}" onchange="setOffer(${i},'suggested',this.value)"></div>`:'';
  const dep = o.pricing==='Deposit + balance'?`<div class="f"><label>Deposit ($)</label><input type="number" value="${o.deposit}" onchange="setOffer(${i},'deposit',this.value)"></div><div class="f"><label>Balance ($)</label><input type="number" value="${o.price}" onchange="setOffer(${i},'price',this.value)"></div>`:'';
  const tier = o.pricing==='Tiered by audience'?`<div class="f" style="grid-column:1/-1"><label>Tiers (name:price, comma-separated)</label><input type="text" value="${o.variantList}" placeholder="GA:25, VIP:60, Early:20" onchange="setOffer(${i},'variantList',this.value)"></div>`:'';

  const party = ['Table / seating','Appointment / service','Class / session seat'].includes(o.archetype)?`<div class="f"><label>Party size min</label><input type="number" value="${o.partyMin}" onchange="setOffer(${i},'partyMin',this.value)"></div><div class="f"><label>Party size max</label><input type="number" value="${o.partyMax}" onchange="setOffer(${i},'partyMax',this.value)"></div>`:'';

  return `<div class="offer">
    <div class="offerhd">
      <span class="onum">Offer ${i+1}</span>
      <span class="obadge">${o.archetype}</span>
      <button class="btn-x" onclick="removeOffer(${i})" title="Remove">✕</button>

      <div class="f"><label>Archetype</label>${sel(o.archetype,ARCHETYPES,`changeArch(${i},this.value)`)}</div>

      ${cap}
      <div class="f"><label>Selection model</label>${sel(o.selection,SELECTION,`setOffer(${i},'selection',this.value)`)}</div>
    </div>
    <div class="adv">
      <div class="advtog ${open?'open':''}" onclick="toggleAdv(${i})"><span class="car">▶</span>${open?'Hide advanced options':'Advanced options'}</div>
      ${open?`

      </div>

        <label class="tog"><input type="checkbox" ${o.variants?'checked':''} onchange="setBool(${i},'variants',this.checked)">Variants</label>

function screenOffers(){

}

/* ---------- STEP 4: review ---------- */
function clean(o){
  const out={archetype:o.archetype,name:o.name||'(unnamed)',pricing:{model:o.pricing}};
  if(o.pricing==='Fixed'||o.pricing==='Variable / choose amount')out.pricing.price=Number(o.price)||0;
  if(o.pricing==='Pay-what-you-want'){out.pricing.min=Number(o.minAmount)||0;out.pricing.suggested=Number(o.suggested)||0;}
  if(o.pricing==='Deposit + balance'){out.pricing.deposit=Number(o.deposit)||0;out.pricing.balance=Number(o.price)||0;}
  if(o.pricing==='Tiered by audience')out.pricing.tiers=o.variantList||'';
  out.inventory={type:o.inventory};if(o.cap&&(o.inventory==='Fixed cap'||o.inventory==='Per-slot cap'))out.inventory.cap=Number(o.cap);
  if(o.perGuestLimit)out.perGuestLimit=Number(o.perGuestLimit);
  out.quantity=o.quantity;
  out.selection=o.selection;
  if(o.requiresPrereq)out.prerequisite=o.prereqName||true;
  if(o.sponsor)out.sponsor=o.sponsor;
  if(o.winner&&o.winner!=='N/A')out.winnerSelection=o.winner;
  if(o.variants)out.variants=o.variantList||true;
  if(o.modifiers)out.modifiers=true; if(o.addOns)out.addOns=true;
  out.timing={mode:o.timing}; if(o.duration)out.timing.durationMin=Number(o.duration);
  if(o.partyMin||o.partyMax)out.partySize={min:Number(o.partyMin)||1,max:Number(o.partyMax)||null};
  out.eligibility=o.eligibility.slice();
  out.fulfillment=o.fulfillment; out.redemption=o.redemption;
  out.fees={serviceFee:o.serviceFee,taxPct:Number(o.taxPct)||0,gratuity:o.gratuity};
  out.policy={refund:o.refund,transferable:o.transferable};
  if(o.seated){
    out.seating={mode:o.seatMode,sections:(o.sections||[]).map(s=>({name:s.name||'(section)',price:Number(s.price)||0,seats:Number(s.seats)||0})),totalSeats:sectionsTotal(o),serviceFeePerTicket:Number(o.perTicketFee)||0,facilityFeePerTicket:Number(o.facilityFee)||0};
    out.inventory={type:'Seat inventory',total:sectionsTotal(o)};
    out.selection='Assigned seats (seat map)';
  }
  if(o.verification!=='None')out.verification=o.verification;
  if(o.archetype==='Appointment / service')out.professional={provider:o.provider||'',visitType:o.visitType||'',clientStatus:o.clientStatus,insurance:o.insurance,intakeRequired:o.intake,confidential:o.confidential,regulated:o.regulated};
  return out;
}
function priceLabel(o){
  if(o.seated)return priceRange(o)||'Reserved seating';
  if(o.pricing==='Free')return 'Free';
  if(o.pricing==='Fixed'||o.pricing==='Variable / choose amount')return o.price?`$${o.price}`:o.pricing;
  if(o.pricing==='Pay-what-you-want')return o.suggested?`PWYW · sugg. $${o.suggested}`:'Pay what you want';
  if(o.pricing==='Deposit + balance')return `$${o.deposit||0} dep${o.price?` + $${o.price}`:''}`;
  if(o.pricing==='Tiered by audience')return o.variantList||'Tiered';
  return o.pricing;
}
function screenReview(){
  const d=CFG.drop;
  const dropRows=DROP_FIELDS.map(([k,label])=>`<dt>${label}</dt><dd>${d[k]}</dd>`).join('');
  const offers=CFG.offers.map((o,i)=>{
    const tags=[];
    if(o.sponsor)tags.push(`Sponsored · ${o.sponsor}`);
    tags.push(priceLabel(o));
    if(o.winner&&o.winner!=='N/A')tags.push(o.winner);
    if(o.seated){
      tags.push(`${(o.sections||[]).length} sections`);
      tags.push(`${sectionsTotal(o).toLocaleString()} seats`);
      tags.push(o.seatMode);
      if(Number(o.perTicketFee)||Number(o.facilityFee))tags.push(`+$${(Number(o.perTicketFee)||0)+(Number(o.facilityFee)||0)} fees/ticket`);
    }else{
      tags.push(o.inventory + (o.cap&&(o.inventory==='Fixed cap'||o.inventory==='Per-slot cap')?` (${o.cap})`:''));
      tags.push(o.selection);
    }
    if(o.duration)tags.push(`${o.duration} min`);
    if(o.verification!=='None')tags.push(o.verification);
    if(o.eligibility.includes('Geo-fenced'))tags.push('Geo-fenced');
    if(o.confidential)tags.push('Confidential');
    if(o.requiresPrereq)tags.push('Prerequisite');
    return `<div class="ro"><div class="roh"><span class="onum">Offer ${i+1}</span><span class="obadge">${o.archetype}</span><span style="font-weight:700;font-size:13px">${o.name||'(unnamed)'}</span></div>
      <div>${tags.map(t=>`<span class="rtag">${t}</span>`).join('')}</div></div>`;
  }).join('');
  const model={drop:CFG.drop,offers:CFG.offers.map(clean)};
  return `<div class="card pad" style="margin-bottom:14px"><h2>Review</h2><div class="h2sub" style="margin:0">Here's the full drop. The data model below is what Nigh stores.</div></div>
    <div class="card"><div class="sec">Drop</div><dl class="rev">${dropRows}</dl></div>
    <div class="card"><div class="sec">Offers (${CFG.offers.length})</div>${offers}</div>
    <div class="card"><details class="json"><summary>🧩 View data model (JSON)</summary><pre>${JSON.stringify(model,null,2).replace(/</g,'&lt;')}</pre></details></div>`;
}

/* ---------- chrome ---------- */
const STEP_LABELS=['Business','Drop','Offers','Review'];
function renderStepper(){
  document.getElementById('stepper').innerHTML=STEP_LABELS.map((lbl,idx)=>{const n=idx+1;const cls=n===S.step?'cur':(n<S.step?'done':'');
    return `<div class="step ${cls}" onclick="goStep(${n})"><div class="bar"></div><div class="lbl"><span class="num">${n}</span><span class="txt">${lbl}</span></div></div>`;}).join('');
}
function renderFooter(){
  const back=S.step>1?`<button class="btn btn-ghost" onclick="goStep(${S.step-1})">← Back</button>`:'<span></span>';
  let next='';
  if(S.step===1)next=`<span class="ghosthint">Pick a template to continue →</span>`;
  else if(S.step<4)next=`<button class="btn btn-primary" onclick="goStep(${S.step+1})">${S.step===3?'Review':'Next'} →</button>`;
  else next=`<button class="btn btn-ghost" onclick="goStep(1)">Start over</button>`;
  document.getElementById('footin').innerHTML=`${back}<span class="spacer"></span>${next}`;
}
function render(){
  renderStepper();renderFooter();
  const s=document.getElementById('screen');
  s.innerHTML=S.step===1?screenBusiness():S.step===2?screenDrop():S.step===3?screenOffers():screenReview();
  window.scrollTo({top:0,behavior:'instant'});
}
render();
</script></body></html>
