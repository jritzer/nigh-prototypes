<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nigh — Inbox + "From Nigh" Channel (Prototype)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1C1C24;color:#fff;display:flex;justify-content:center;min-height:100vh;padding:24px 12px}
.phone{width:390px;max-width:100%;height:812px;background:#0B0B1A;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.scroll{overflow-y:auto;flex:1}
.scroll::-webkit-scrollbar{width:0}
.hdr{background:#0B0B1A;padding:16px 16px 0;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:9}
.title{font-size:20px;font-weight:800}
.tabs{display:flex;align-items:center;margin:8px -8px 0}
.tab{flex:1;background:none;border:none;padding:14px 0 12px;font-size:15px;cursor:pointer;font-family:inherit;position:relative;color:rgba(255,255,255,0.45);font-weight:600}
.tab.on{color:#fff;font-weight:800}
.tab .bar{position:absolute;bottom:0;left:0;right:0;height:2.5px;border-radius:2px;background:transparent}
.tab.on .bar{background:#fff}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:#0E4EF5;color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
.row{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;gap:12px;align-items:center;cursor:pointer}
.row:active{background:rgba(255,255,255,0.03)}
.av{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;color:#fff}
.av.circle{border-radius:50%}
.nm{font-size:14px;font-weight:700}
.sb{font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#0E4EF5;flex-shrink:0}
.pin{background:linear-gradient(90deg,rgba(14,78,245,0.10),rgba(98,38,233,0.04))}
.fab{position:absolute;right:18px;bottom:84px;width:56px;height:56px;border-radius:50%;background:#0E4EF5;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 20px rgba(14,78,245,0.5);z-index:20}
.nav{height:64px;background:#0B0B1A;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-around;flex-shrink:0}
.nav svg{color:rgba(255,255,255,0.35)}
.nav .act svg{color:#fff}
.chBack{background:none;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit;font-size:14px;padding:0}
.verified{color:#0E4EF5}
.note{font-size:13px;color:rgba(255,255,255,0.85);line-height:1.55}
.card{background:#12121F;border:1px solid rgba(255,255,255,0.07);border-radius:14px;overflow:hidden;margin:0 0 14px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);color:#fff;font-size:12px;padding:9px 16px;border-radius:20px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.when{font-size:11px;color:rgba(255,255,255,0.4);text-align:center;margin:4px 0 12px}
@keyframes prog{from{width:0}to{width:100%}}
</style></head>

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

function rowHTML(m){
 var avStyle='background:'+m.grad+(m.avColor?';color:'+m.avColor:'');
 var click=m.nigh?'onclick="openChannel()"':m.support?'onclick="openSupport()"':m.hostId?'onclick="openHost(\''+m.hostId+'\')"':m.gallery?'onclick="openGallery()"':'';
 return '<div class="row '+(m.pin?'pin':'')+'" '+click+'>'
  +'<div class="av '+(m.circle?'circle':'')+'" style="'+avStyle+'">'+(m.icon||m.av)+'</div>'
  +'<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:5px">'
  +'<span class="nm">'+esc(m.nm)+'</span>'
  +((m.nigh||m.support||m.firstParty)?'<span class="verified" style="display:flex">'+ICON.check+'</span>':'')
  +((m.nigh||m.firstParty)?'<span title="Nigh broadcast" style="display:flex;color:rgba(255,255,255,0.3);margin-left:1px">'+ICON.broadcast+'</span>':m.group?'<span title="Group chat" style="display:flex;color:rgba(255,255,255,0.3);margin-left:1px">'+ICON.people+'</span>':'')
  +'</div><div class="sb">'+esc(m.sb)+'</div></div>'
  +(m.muted?'<span style="color:rgba(255,255,255,0.3);display:flex" title="Muted">'+ICON.bellOff+'</span>':(m.unread?'<span class="dot"></span>':''))+'</div>';
}

function renderInbox(){
 var list=(S.tab==='messages'?MESSAGES:NOTIFS).map(function(m){
   if(m.nigh&&S.muted)return Object.assign({},m,{unread:false,muted:true});
   if(m.support)return Object.assign({},m,{sb:supportSb(),unread:S.caseState!=='none'});
   return m;
 });
 var msgN=MESSAGES.filter(function(m){return m.unread&&!(m.nigh&&S.muted);}).length;
 var notN=3;
 var body=list.map(function(m){return rowHTML(m);}).join('');
 return '<div class="hdr">'
  +'<div class="title">Inbox</div>'
  +'<div class="tabs">'
   +'<button class="tab '+(S.tab==='messages'?'on':'')+'" onclick="switchTab(\'messages\')">Messages'+(msgN?'<span class="badge">'+msgN+'</span>':'')+'<div class="bar"></div></button>'
   +'<button class="tab '+(S.tab==='notifications'?'on':'')+'" onclick="switchTab(\'notifications\')">Notifications'+(notN?'<span class="badge">'+notN+'</span>':'')+'<div class="bar"></div></button>'
  +'</div></div>'
  +'<div class="scroll">'+body+'<div style="height:40px"></div></div>'
  +(S.tab==='messages'?'<button class="fab" onclick="compose()">'+ICON.plus+'</button>':'')
  +navBar();
}

}

function gItem(n,h){var eid='g_'+n.replace(/[^a-zA-Z0-9]/g,'');return '<div style="margin-bottom:16px"><div style="font-size:11px;color:#41EFF9;margin-bottom:7px">'+n+'</div>'+h+(SOCIAL[n]?engagementBar(eid):'')+'</div>';}
function engagementBar(id){var h=0,k;for(k=0;k<id.length;k++)h+=id.charCodeAt(k);return reactionRow(id,{seed:true,comments:1+(h%6)});}
function pollOpt(l,p){return '<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>'+l+'</span><span style="color:rgba(255,255,255,0.5)">'+p+'%</span></div><div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+p+'%;background:#0E4EF5"></div></div></div>';}
function reactSeed(id){if(S.reax[id])return;var h=0,k;for(k=0;k<id.length;k++)h+=id.charCodeAt(k);S.reax[id]={};S.reax[id][EMOJIS[0]]={count:6+(h%9),me:false};S.reax[id][EMOJIS[3]]={count:2+(h%5),me:false};}
function reactionRow(id,opts){opts=opts||{};if(opts.seed)reactSeed(id);else if(!S.reax[id])S.reax[id]={};var rx=S.reax[id];
 var pills=Object.keys(rx).map(function(e){var o=rx[e];return '<button onclick="reactToggle(\''+id+'\',\''+e+'\')" style="background:'+(o.me?'rgba(14,78,245,0.22)':'rgba(255,255,255,0.06)')+';border:1px solid '+(o.me?'#0E4EF5':'rgba(255,255,255,0.1)')+';border-radius:20px;padding:3px 9px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#fff;font-family:inherit">'+e+'<span style="font-size:11px;color:rgba(255,255,255,0.6)">'+o.count+'</span></button>';}).join('');
 var add='<button onclick="reactPickOpen(\''+id+'\')" aria-label="Add reaction" style="background:'+(S.reaxPicker===id?'rgba(65,239,249,0.15)':'rgba(255,255,255,0.06)')+';border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:4px 8px;cursor:pointer;color:'+(S.reaxPicker===id?'#41EFF9':'rgba(255,255,255,0.5)')+';display:inline-flex">'+ICON.smile+'</button>';
 var comments=opts.comments!=null?'<span style="margin-left:auto;font-size:12px;color:rgba(255,255,255,0.4);display:inline-flex;align-items:center;gap:4px">'+ICON.chat+' '+opts.comments+'</span>':'';
 var picker=S.reaxPicker===id?'<div style="margin-top:8px;display:inline-flex;gap:11px;background:#1c1c28;border:1px solid rgba(255,255,255,0.12);border-radius:22px;padding:7px 13px">'+EMOJIS.map(function(e,i){return '<span onclick="reactPick(\''+id+'\','+i+')" style="font-size:21px;cursor:pointer;line-height:1">'+e+'</span>';}).join('')+'</div>':'';
 return '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px">'+pills+add+comments+'</div>'+picker;}
function reactToggle(id,e){if(!S.reax[id])S.reax[id]={};var o=S.reax[id][e];if(!o){S.reax[id][e]={count:1,me:true};}else if(o.me){o.count--;o.me=false;if(o.count<=0)delete S.reax[id][e];}else{o.count++;o.me=true;}render();}
function reactPickOpen(id){S.reaxPicker=S.reaxPicker===id?null:id;render();}
function reactPick(id,i){var e=EMOJIS[i];if(!S.reax[id])S.reax[id]={};if(!S.reax[id][e])S.reax[id][e]={count:0,me:false};if(!S.reax[id][e].me){S.reax[id][e].count++;S.reax[id][e].me=true;}S.reaxPicker=null;render();}

function render(){
 var v=S.screen==='channel'?renderChannel():S.screen==='support'?renderSupport():S.screen==='host'?renderHost():S.screen==='gallery'?renderGallery():renderInbox();
 document.getElementById('app').innerHTML = v;
}
function switchTab(t){S.tab=t;render();}
function openChannel(){S.screen='channel';render();}
function openSupport(){S.screen='support';render();}
function openHost(id){S.hostId=id;S.screen='host';render();}
function openGallery(){S.screen='gallery';render();}
function sendHostReply(){var i=document.getElementById('hreply');if(!i)return;var v=i.value.trim();if(!v)return;if(!S.hostReplies[S.hostId])S.hostReplies[S.hostId]=[];S.hostReplies[S.hostId].push(v);render();var sc=document.querySelector('.scroll');if(sc)sc.scrollTop=sc.scrollHeight;}
function sendSupportReply(){var i=document.getElementById('sreply');if(!i)return;var v=i.value.trim();if(!v)return;S.supportReplies.push(v);render();var sc=document.querySelector('.scroll');if(sc)sc.scrollTop=sc.scrollHeight;}
function back(){S.screen='inbox';S.playing=false;S.pickerFor=null;S.gPicker=null;S.replyOpen=false;S.feedbackSent=false;render();}
function togglePlay(e){if(e)e.stopPropagation();S.playing=!S.playing;render();}
function toggleLike(e){if(e)e.stopPropagation();S.liked=!S.liked;S.likeCount+=S.liked?1:-1;render();}
function sendReply(){var i=document.getElementById('teamreply');if(!i)return;var v=i.value.trim();if(!v)return;S.feedbackSent=true;S.replyOpen=false;render();}
function toggleMute(){S.muted=!S.muted;render();toast(S.muted?'Muted Nigh Team':'Unmuted Nigh Team');}
function compose(){toast('New message — (prototype)');}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('app').appendChild(t);requestAnimationFrame(function(){t.classList.add('show');});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},250);},1600);}
render();
</script></body></html>
