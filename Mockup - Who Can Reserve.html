<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Who Can Reserve Tickets</title>
<style>
  :root{ --blue:#0E4EF5; --ink:#1a1a22; --muted:#8A8F9A; --line:#E6E8EC; --bg:#EDEFF2; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);padding:28px 16px;}
  .wrap{max-width:460px;margin:0 auto;}
  .note{font-size:13px;color:#6b7280;text-align:center;margin:0 auto 18px;max-width:420px;line-height:1.5;}
  .card{background:#fff;border-radius:22px;box-shadow:0 10px 40px rgba(20,25,40,0.12);overflow:hidden;}
  .hd{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;}
  .hd svg{margin-top:3px;}
  .hd h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-0.02em;}
  .hd p{font-size:14px;color:var(--muted);margin:3px 0 0;font-weight:500;}
  .prog{display:flex;gap:6px;padding:14px 22px 0;}
  .prog span{height:5px;border-radius:3px;flex:1;background:#E6E8EC;}
  .prog span.on{background:var(--blue);}
  .body{padding:20px 22px 26px;}
  label.fld{display:block;font-size:14px;font-weight:700;margin:18px 0 8px;}
  label.fld:first-child{margin-top:4px;}
  .req{color:#E0314B;}
  .inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:14px 14px;font-size:15px;color:var(--ink);font-family:inherit;background:#fff;}
  .inp::placeholder{color:#B4B9C2;}

  /* dropdown */
  .dd{position:relative;}
  .dd-head{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:12px;padding:14px 14px;cursor:pointer;background:#fff;user-select:none;}
  .dd-head .lbl{flex:1;font-size:15px;font-weight:600;}
  .dd-head .chev{transition:transform .2s;color:#9aa0aa;}
  .dd.open .dd-head{border-color:var(--blue);border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .dd.open .dd-head .chev{transform:rotate(180deg);}
  .menu{display:none;border:1.5px solid var(--blue);border-top:none;border-radius:0 0 12px 12px;overflow:hidden;}
  .dd.open .menu{display:block;}
  .opt{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;cursor:pointer;border-top:1px solid #f0f1f4;}
  .opt:first-child{border-top:none;}
  .opt:hover{background:#F7F9FF;}
  .opt.sel{background:#F2F6FF;}
  .opt .oi{margin-top:1px;flex-shrink:0;color:#6b7280;}
  .opt.sel .oi{color:var(--blue);}
  .opt .ot{flex:1;}
  .opt .ottitle{font-size:15px;font-weight:700;}
  .opt.sel .otitle{color:var(--blue);}
  .opt .osub{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35;font-weight:500;}
  .opt .ochev{color:#9aa0aa;margin-top:2px;}
  .opt.sel .ochev{color:var(--blue);}

  /* sublist */
  .sub{display:none;background:#FAFBFC;}
  .opt.sel.hasSub + .sub{display:block;}
  .srow{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 40px;border-top:1px solid #eef0f3;cursor:pointer;}
  .radio{width:20px;height:20px;border-radius:50%;border:2px solid #CBD0D8;flex-shrink:0;position:relative;}
  .srow.on .radio{border-color:var(--blue);}
  .srow.on .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--blue);}
  .srow .sname{flex:1;font-size:15px;font-weight:500;}
  .srow .scount{font-size:14px;color:#9aa0aa;}

  /* password flag */
  .pw{margin-top:14px;border:1.5px solid var(--line);border-radius:12px;padding:4px 14px;display:none;}
  .pw.show{display:block;}
  .pw-row{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;}
  .pw-row .ptxt{flex:1;}
  .pw-row .ptitle{font-size:14.5px;font-weight:700;}
  .pw-row .psub{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:500;}
  .tg{width:46px;height:28px;border-radius:16px;background:#D4D8DF;position:relative;transition:background .18s;flex-shrink:0;}
  .tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s;}
  .pw.on .tg{background:var(--blue);}
  .pw.on .tg::after{left:21px;}
  .pw-field{display:none;padding:0 0 14px;}
  .pw.on .pw-field{display:block;}
  .pw-field .inp{padding:12px 14px;font-size:14px;}
  .hint{font-size:12px;color:var(--muted);margin:7px 2px 0;line-height:1.4;}
</style>
</head>
<body>
<div class="wrap">
  <p class="note">Interactive mockup — tap the dropdown, pick different audiences, and watch the <strong>Require a password</strong> flag appear only for link-based access.</p>

  <div class="card">
    <div class="hd">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1a22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <div>
        <h1>Create Drop</h1>
        <p>Step 3/4 — Drop Guests &amp; Pricing</p>
      </div>
    </div>
    <div class="prog"><span class="on"></span><span class="on"></span><span class="on"></span><span></span></div>

    <div class="body">
      <label class="fld">Drop Tickets <span class="req">*</span></label>
      <input class="inp" placeholder="Number of spots">

      <label class="fld">Max Tickets Per Guest <span class="req">*</span></label>
      <input class="inp" placeholder="Max tickets per guest">

      <label class="fld">Who Can Reserve Tickets <span class="req">*</span></label>
      <div class="dd" id="dd">
        <div class="dd-head" onclick="toggleDD()">
          <span id="headIcon"></span>
          <span class="lbl" id="headLbl">Anyone on Nigh</span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="menu" id="menu"></div>
      </div>

      <!-- contextual password flag -->
      <div class="pw" id="pw">
        <div class="pw-row" onclick="togglePW()">
          <div class="ptxt">
            <div class="ptitle">Require a password</div>
            <div class="psub">Guests enter password to view and reserve</div>
          </div>
          <div class="tg"></div>
        </div>
        <div class="pw-field">
          <input class="inp" placeholder="Set a password" value="">
        </div>
      </div>
      <div class="hint" id="hint"></div>

    </div>
  </div>
</div>

<script>
  // icons
  const I = {
    globe:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg>',
    users:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    list:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><rect x="15.5" y="8.5" width="7" height="6" rx="1.4"/><path d="M17 8.5V7a2 2 0 0 1 4 0v1.5"/></svg>',
    link:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    linkLock:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><g transform="translate(-2.4,-2.6) scale(0.8)" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></g><circle cx="17.6" cy="17.8" r="6.3" fill="#fff"/><rect x="14.6" y="17.3" width="6" height="4.5" rx="1" fill="currentColor"/><path d="M15.9 17.3v-1.3a1.7 1.7 0 0 1 3.4 0v1.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
  };

  const OPTS = [
    {key:'anyone', icon:'globe', title:'Anyone on Nigh', pw:false},
    {key:'followers', icon:'users', title:'Followers Only', pw:false},
    {key:'link', icon:'link', title:'Anyone with the Link', pw:true},
    {key:'list', icon:'list', title:'Select Specific List', pw:false, hasSub:true}
  ];
  const LISTS = [['Close Friends',8],['College Crew',7],['Boulder Squad',7],['Family',7],['Work Friends',5],['Neighbors',4],['Running Club',4]];

  let sel = 'anyone';
  let selList = null;

  function buildMenu(){
    const m = document.getElementById('menu');
    m.innerHTML = OPTS.map(o=>{
      let html = `<div class="opt ${o.key===sel?'sel':''} ${o.hasSub?'hasSub':''}" onclick="pick('${o.key}')">
        <span class="oi">${I[o.icon]}</span>
        <span class="ot"><span class="otitle">${o.title}</span></span>
        ${o.hasSub?'<svg class="ochev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>':''}
      </div>`;
      if(o.hasSub){
        html += `<div class="sub">` + LISTS.map(l=>`
          <div class="srow ${selList===l[0]?'on':''}" onclick="event.stopPropagation();pickList('${l[0]}')">
            <span class="radio"></span><span class="sname">${l[0]}</span><span class="scount">${l[1]}</span>
          </div>`).join('') + `</div>`;
      }
      return html;
    }).join('');
  }

  function toggleDD(){ document.getElementById('dd').classList.toggle('open'); }

  function curIconHtml(){
    if(sel==='link' && document.getElementById('pw').classList.contains('on')) return I.linkLock;
    const o = OPTS.find(x=>x.key===sel); return I[o.icon];
  }
  function setHead(){ document.getElementById('headIcon').innerHTML = `<span style="display:flex;color:#0E4EF5">${curIconHtml()}</span>`; }

  function pick(k){
    sel = k;
    const o = OPTS.find(x=>x.key===k);
    document.getElementById('headLbl').textContent = o.title;
    if(k!=='list'){ selList=null; document.getElementById('dd').classList.remove('open'); }
    buildMenu();
    refreshPW();
    setHead();
  }
  function pickList(name){ selList = name; document.getElementById('headLbl').textContent = name; document.getElementById('dd').classList.remove('open'); buildMenu(); refreshPW(); setHead(); }

  function refreshPW(){
    const o = OPTS.find(x=>x.key===sel);
    const pw = document.getElementById('pw');
    const hint = document.getElementById('hint');
    if(o.pw){
      pw.classList.add('show');
      hint.textContent = sel==='link'
        ? ''
        : 'Optional second layer — people on the list still enter a password to reserve.';
    } else {
      pw.classList.remove('show'); pw.classList.remove('on');
      hint.textContent = sel==='anyone'
        ? 'Fully public — no password, since Niya recommends this Drop to people who’d love it.'
        : 'Gated to your followers — no password needed.';
    }
  }

  function togglePW(){ document.getElementById('pw').classList.toggle('on'); setHead(); }

  // init
  pick('anyone');
  buildMenu();
  setHead();
</script>
</body>
</html>
